<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf1f4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="小朋友的集點卡">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>小朋友的集點卡</title>
<style>
:root{--bg:#fbf1f4;--card:#fff;--ink:#4a3340;--sub:#8a7480;--acc:#95597a;--soft:#f6e4ec;--ok:#e6f1ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#241a20;--card:#32242c;--ink:#f5e6ed;--sub:#b99aa9;--acc:#d792b6;--soft:#43303a;--ok:#2d3d34}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;padding:16px}
.wrap{max-width:480px;margin:0 auto}
h1{font-size:22px;margin:0 0 2px}
.head{display:flex;gap:14px;align-items:center;margin:8px 0 14px}
.ava{width:64px;height:64px;border-radius:20px;object-fit:cover;border:3px solid var(--soft)}
.sub{color:var(--sub);font-size:14px;margin:0 0 14px}
.card{background:var(--card);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(149,89,122,.12)}
.row{display:flex;gap:10px}
.stat{flex:1;background:var(--soft);border-radius:18px;padding:14px}
.stat small{color:var(--sub);font-size:13px}
.stat b{display:block;font-size:34px;color:var(--acc);margin-top:4px}
.bar{height:12px;background:var(--soft);border-radius:8px;margin:14px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#d08aae,var(--acc));border-radius:8px;transition:width .3s}
h2{font-size:17px;margin:0 0 10px}
button{font:inherit;border:0;border-radius:16px;padding:12px 8px;cursor:pointer;background:var(--soft);color:var(--acc);font-weight:700}
button.p{background:var(--acc);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.task{gap:12px;display:flex;justify-content:space-between;align-items:center;width:100%;margin-bottom:8px;background:var(--ok);color:var(--ink);text-align:left;padding:12px 14px}
.task em{font-style:normal;color:var(--acc)}
input{width:100%;font:inherit;padding:11px 12px;border-radius:14px;border:1px solid var(--soft);background:var(--bg);color:var(--ink);margin-bottom:10px}
.log{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--soft);font-size:14px}
.log span{color:var(--sub)}
.pos{color:var(--acc);font-weight:700}.neg{color:var(--sub);font-weight:700}
#msg{color:var(--sub);font-size:13px;min-height:18px}
.link{background:none;color:var(--sub);font-weight:400;text-decoration:underline;padding:6px}
[hidden]{display:none!important}
.gacha{text-align:center;overflow:hidden}
.gacha .sub{margin:0 0 4px}
.machine{width:min(260px,70vw);height:auto;display:block;margin:0 auto}
.machine.jig{animation:jig .5s ease-in-out 2}
@keyframes jig{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-4px) rotate(-1.5deg)}75%{transform:translateX(4px) rotate(1.5deg)}}
.knob{transform-box:fill-box;transform-origin:center}
.machine.jig .knob{animation:spin 1s ease-in-out}
@keyframes spin{to{transform:rotate(360deg)}}
.balls circle,.balls path{transform-box:fill-box;transform-origin:center}
.machine.jig .balls .b{animation:bounce .45s ease-in-out 3}
.machine.jig .balls .b:nth-child(even){animation-delay:.12s}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
#dropcap{opacity:0}
#dropcap.fall{animation:fall .8s cubic-bezier(.5,0,.8,.6) forwards}
@keyframes fall{0%{opacity:1;transform:translateY(0)}70%{opacity:1;transform:translateY(132px)}85%{opacity:1;transform:translateY(122px)}100%{opacity:1;transform:translateY(132px)}}
.prizebox{min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;margin:6px 0 10px;padding:10px;border-radius:20px;background:var(--soft)}
.prizebox .pe{font-size:44px;line-height:1.1}
.prizebox .pt{font-size:20px;font-weight:700;color:var(--acc)}
.prizebox .ph{font-size:13px;color:var(--sub)}
.prizebox.pop .pe,.prizebox.pop svg{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.2) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.hearts{position:relative;height:0}
.hearts i{position:absolute;left:50%;top:-30px;font-style:normal;font-size:18px;opacity:0}
.hearts.go i{animation:float 1.1s ease-out forwards}
@keyframes float{0%{opacity:1;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(var(--dx),-70px) scale(1.2)}}
@media (prefers-reduced-motion:reduce){.machine.jig,.machine.jig .knob,.machine.jig .balls .b,#dropcap.fall,.prizebox.pop .pe,.prizebox.pop svg,.hearts.go i{animation:none}#dropcap.fall{opacity:1;transform:translateY(132px)}}
</style>
</head>
<body>
<div class="wrap">
<div class="head"><img src="photo.jpg" alt="" class="ava"><div><h1>小朋友的集點卡</h1><p class="sub" style="margin:0">把每一次努力，蓋成你們的小回憶</p></div></div>
<div id="msg">載入中…</div>
<div class="card">
<div class="row">
<div class="stat"><small>待兌換點數</small><b id="pts">0</b></div>
<div class="stat"><small>可兌換禮物</small><b id="cards">0 張</b></div>
</div>
<div class="bar"><i id="fill" style="width:0%"></i></div>
<div class="sub" id="hint" style="margin:0"></div>
</div>
<div class="card">
<h2 id="taskTitle">任務清單</h2>
<button class="task" data-d="1" data-n="誇獎漂亮女友"><span>誇獎漂亮女友</span><em>+1 點</em></button>
<button class="task" data-d="1" data-n="分享今日小確幸"><span>分享今日小確幸</span><em>+1 點</em></button>
<button class="task" data-d="1" data-n="自己想要吃什麼"><span>自己想要吃什麼</span><em>+1 點</em></button>
<button class="task" data-d="2" data-n="出去玩自己想行程"><span>出去玩自己想行程</span><em>+2 點</em></button>
<button class="task" data-d="3" data-n="乖乖運動"><span>乖乖運動</span><em>+3 點</em></button>
<button class="task" data-d="2" data-n="拍照給漂亮女友（包括自己、寵物、做什麼）"><span>拍照給漂亮女友（包括自己、寵物、做什麼）</span><em>+2 點</em></button>
</div>
<div id="admin" hidden>
<div class="card">
<h2>手動調整點數</h2>
<input id="note" placeholder="備註（選填，他也看得到）" maxlength="30">
<div class="grid"><button class="p" data-d="1">+1</button><button class="p" data-d="5">+5</button><button class="p" data-d="10">+10</button></div>
<div class="grid"><button data-d="-1">−1</button><button data-d="-5">−5</button><button data-d="-10">−10</button></div>
</div>
</div>
<div class="card gacha">
<h2>扭蛋機 🌸</h2>
<p class="sub">每天凌晨 12 點更新，一天扭一次</p>
<svg class="machine" id="machine" viewBox="0 0 240 300" role="img" aria-label="可愛的扭蛋機">
  <defs><clipPath id="globeClip"><circle cx="120" cy="100" r="66"/></clipPath></defs>
  <ellipse cx="120" cy="288" rx="84" ry="9" fill="#000" opacity=".12"/>
  <rect x="40" y="150" width="160" height="130" rx="30" fill="#ef9fc2"/>
  <rect x="40" y="236" width="160" height="44" rx="22" fill="#d97fa9"/>
  <circle cx="120" cy="100" r="72" fill="#fff" opacity=".55" stroke="#d98fb1" stroke-width="5"/>
  <g clip-path="url(#globeClip)" class="balls" id="balls"></g>
  <path d="M60 78 A66 66 0 0 1 100 44" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".8"/>
  <rect x="84" y="20" width="72" height="18" rx="9" fill="#d98fb1"/>
  <circle cx="120" cy="190" r="29" fill="#fff" stroke="#d98fb1" stroke-width="5"/>
  <g class="knob"><rect x="98" y="184" width="44" height="12" rx="6" fill="#ef9fc2"/><circle cx="120" cy="190" r="6" fill="#d97fa9"/></g>
  <rect x="82" y="224" width="76" height="46" rx="14" fill="#8f4a6e"/>
  <g id="dropcap"><circle cx="120" cy="120" r="17" fill="#ffd166"/><path d="M103 120 a17 17 0 0 0 34 0 z" fill="#fff6e0"/><circle cx="114" cy="113" r="4" fill="#fff" opacity=".8"/></g>
  <path d="M82 238 h76 v32 a14 14 0 0 1 -14 0 h-48 a14 14 0 0 1 -14 0 z" fill="#8f4a6e" opacity="0"/>
</svg>
<div class="hearts" id="hearts"></div>
<div class="prizebox" id="prizebox" aria-live="polite"><div class="pe">🎀</div><div class="pt">按下去看看會抽到什麼</div></div>
<button class="p" id="gachaBtn" style="width:100%">扭一下！</button>
</div>
<div class="card"><h2>紀錄</h2><div id="log"><span class="sub">還沒有紀錄</span></div></div>
<div class="card" id="loginBox">
<h2>管理員登入</h2>
<input id="em" type="email" placeholder="Email" autocomplete="username">
<input id="pw" type="password" placeholder="密碼" autocomplete="current-password">
<button class="p" id="loginBtn" style="width:100%">登入</button>
</div>
<div style="text-align:center"><button class="link" id="outBtn" hidden>登出</button></div>
</div>
<script>
(function(){
  var INK='#5b3a4a',PINK='#ff7a9c',SKIN,LINE,STRIPE,EAR,WHITE=false;
  var CATS={
    o:{skin:'#ffe6cc',line:'#e3a06c',stripe:'#e3a06c',ear:'#ffb3cb',white:false},
    t:{skin:'#bba58f',line:'#7b6450',stripe:'#5a4636',ear:'#eab9bd',white:true}
  };
  function useCat(c){var k=CATS[c]||CATS.o;SKIN=k.skin;LINE=k.line;STRIPE=k.stripe;EAR=k.ear;WHITE=k.white}
  function B(){
    var s='<path d="M21 52 L22 17 L52 36 Z" fill="'+SKIN+'" stroke="'+LINE+'" stroke-width="3" stroke-linejoin="round"/><path d="M99 52 L98 17 L68 36 Z" fill="'+SKIN+'" stroke="'+LINE+'" stroke-width="3" stroke-linejoin="round"/><path d="M28 44 L28 27 L43 37 Z" fill="'+EAR+'" stroke="'+EAR+'" stroke-width="2" stroke-linejoin="round"/><path d="M92 44 L92 27 L77 37 Z" fill="'+EAR+'" stroke="'+EAR+'" stroke-width="2" stroke-linejoin="round"/><ellipse cx="60" cy="64" rx="40" ry="34" fill="'+SKIN+'" stroke="'+LINE+'" stroke-width="3"/>';
    if(WHITE)s+='<path d="M60 33 q-7 0 -7 8 l3 20 q4 5 8 0 l3 -20 q0 -8 -7 -8 z" fill="#fffdf8"/><ellipse cx="60" cy="82" rx="21" ry="15" fill="#fffdf8"/><path d="M50 95 q10 7 20 0" fill="none" stroke="'+LINE+'" stroke-width="3" stroke-linecap="round"/>';
    s+='<path d="M'+(WHITE?'46':'60')+' 31 v9 M'+(WHITE?'38':'51')+' 33 l1.5 7 M'+(WHITE?'74':'69')+' 33 l-1.5 7'+(WHITE?' M30 46 l7 3 M90 46 l-7 3':'')+'" fill="none" stroke="'+STRIPE+'" stroke-width="3" stroke-linecap="round"/><ellipse cx="36" cy="74" rx="7" ry="4" fill="#ff9fba" opacity=".6"/><ellipse cx="84" cy="74" rx="7" ry="4" fill="#ff9fba" opacity=".6"/><path d="M22 68 l-13 -4 M22 74 l-14 3 M98 68 l13 -4 M98 74 l14 3" stroke="'+LINE+'" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M56.5 69 h7 l-3.5 4.5 z" fill="#ff8fa8" stroke="#ff8fa8" stroke-width="1.5" stroke-linejoin="round"/>';
    return s;
  }
  function dot(x,y){return '<circle cx="'+x+'" cy="'+y+'" r="4.5" fill="'+INK+'"/><circle cx="'+(x-1.5)+'" cy="'+(y-1.7)+'" r="1.6" fill="#fff"/>'}
  function arc(x,y,up){return '<path d="M'+x+' '+y+' q5 '+(up?-7:7)+' 10 0" fill="none" stroke="'+INK+'" stroke-width="3" stroke-linecap="round"/>'}
  function smile(){return '<path d="M52 77 q4 5 8 0 q4 5 8 0" fill="none" stroke="'+INK+'" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>'}
  function bubble(x,y,w,txt,fs){return '<g><rect x="'+x+'" y="'+y+'" width="'+w+'" height="20" rx="10" fill="#fff" stroke="'+LINE+'" stroke-width="2"/><text x="'+(x+w/2)+'" y="'+(y+14)+'" text-anchor="middle" font-size="'+(fs||11)+'" font-weight="700" fill="'+INK+'">'+txt+'</text></g>'}
  var ART={
    hug:function(){return '<ellipse cx="12" cy="78" rx="11" ry="7" fill="'+SKIN+'" stroke="'+LINE+'" stroke-width="3" transform="rotate(-25 12 78)"/><ellipse cx="108" cy="78" rx="11" ry="7" fill="'+SKIN+'" stroke="'+LINE+'" stroke-width="3" transform="rotate(25 108 78)"/>'+B()+arc(41,64,1)+arc(69,64,1)+'<path d="M52 76 q8 10 16 0 z" fill="'+PINK+'" stroke="'+INK+'" stroke-width="2.5" stroke-linejoin="round"/><text x="60" y="16" text-anchor="middle" font-size="17">💗</text>'},
    kiss:function(){return B()+arc(41,64,1)+arc(69,64,1)+'<ellipse cx="60" cy="79" rx="3.5" ry="4.5" fill="'+PINK+'"/><text x="94" y="70" font-size="18">💋</text><text x="20" y="40" font-size="14">💗</text>'},
    massage:function(){return B()+arc(41,64,0)+arc(69,64,0)+smile()+'<ellipse cx="22" cy="98" rx="10" ry="8" fill="'+SKIN+'" stroke="'+LINE+'" stroke-width="3"/><ellipse cx="98" cy="98" rx="10" ry="8" fill="'+SKIN+'" stroke="'+LINE+'" stroke-width="3"/>'+bubble(66,4,48,'30 秒',11)},
    praise:function(){return B()+'<circle cx="46" cy="63" r="6" fill="'+INK+'"/><circle cx="74" cy="63" r="6" fill="'+INK+'"/><circle cx="44" cy="60.5" r="2.2" fill="#fff"/><circle cx="72" cy="60.5" r="2.2" fill="#fff"/><circle cx="48" cy="66" r="1.2" fill="#fff"/><circle cx="76" cy="66" r="1.2" fill="#fff"/><path d="M52 76 q8 10 16 0 z" fill="'+PINK+'" stroke="'+INK+'" stroke-width="2.5" stroke-linejoin="round"/>'+bubble(60,2,56,'讚 讚 讚',11)+'<text x="14" y="30" font-size="14">✨</text>'},
    daze:function(){return B()+'<path d="M41 66 h10 M69 66 h10" stroke="'+INK+'" stroke-width="3" stroke-linecap="round"/><path d="M56 80 h8" stroke="'+INK+'" stroke-width="3" stroke-linecap="round"/><circle cx="96" cy="26" r="3" fill="#fff" stroke="'+LINE+'" stroke-width="2"/><circle cx="104" cy="14" r="5" fill="#fff" stroke="'+LINE+'" stroke-width="2"/><text x="104" y="17" text-anchor="middle" font-size="9" font-weight="700" fill="'+INK+'">…</text>'},
    air:function(){return B()+dot(46,62)+dot(74,62)+'<ellipse cx="60" cy="78" rx="5" ry="6" fill="'+PINK+'" stroke="'+INK+'" stroke-width="2"/><ellipse cx="60" cy="108" rx="30" ry="7" fill="#fff" stroke="'+LINE+'" stroke-width="2.5"/><text x="96" y="104" font-size="16">💨</text>'},
    eyeroll:function(){return B()+'<circle cx="46" cy="63" r="7" fill="#fff" stroke="'+INK+'" stroke-width="2.5"/><circle cx="74" cy="63" r="7" fill="#fff" stroke="'+INK+'" stroke-width="2.5"/><circle cx="47" cy="58.5" r="3" fill="'+INK+'"/><circle cx="75" cy="58.5" r="3" fill="'+INK+'"/><path d="M54 81 h12" stroke="'+INK+'" stroke-width="3" stroke-linecap="round"/><text x="96" y="40" font-size="14">💢</text>'},
    pat:function(){return B()+arc(41,64,1)+arc(69,64,1)+smile()+'<ellipse cx="60" cy="14" rx="15" ry="8" fill="'+SKIN+'" stroke="'+LINE+'" stroke-width="3"/><path d="M82 8 q5 -4 8 0 M86 18 q6 -3 9 1" fill="none" stroke="'+LINE+'" stroke-width="2.5" stroke-linecap="round"/><path d="M38 8 q-5 -4 -8 0" fill="none" stroke="'+LINE+'" stroke-width="2.5" stroke-linecap="round"/>'},
    bite:function(){return B()+'<path d="M40 59 l11 5 l-11 5" fill="none" stroke="'+INK+'" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M80 59 l-11 5 l11 5" fill="none" stroke="'+INK+'" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M48 76 h24 v3 q-12 10 -24 0 z" fill="#fff" stroke="'+INK+'" stroke-width="2.5" stroke-linejoin="round"/><path d="M54 75 v6 M60 75 v7 M66 75 v6" stroke="'+LINE+'" stroke-width="1.5"/>'+bubble(66,2,50,'啊嗚 啊嗚',10)},
    thanks:function(){return B()+arc(41,64,1)+dot(74,62)+smile()+'<rect x="26" y="94" width="68" height="24" rx="8" fill="#fff" stroke="'+LINE+'" stroke-width="2.5"/><text x="60" y="111" text-anchor="middle" font-size="12" font-weight="700" fill="'+INK+'">銘謝惠顧</text>'}
  };
  function art(k,c){useCat(c);return '<svg viewBox="0 0 120 124" width="128" height="132" aria-hidden="true" style="overflow:visible">'+ART[k]()+'</svg>'}
  var PRIZES=[
    {k:'hug',c:'o',t:'苑均抱抱'},{k:'kiss',c:'t',t:'苑均親親'},{k:'massage',c:'o',t:'苑均幫你按肩膀 30 秒'},
    {k:'praise',c:'t',t:'苑均誇你三句'},{k:'daze',c:'o',t:'苑均陪你發呆 5 分鐘'},{k:'air',c:'o',t:'苑均請你吃空氣'},
    {k:'eyeroll',c:'t',t:'苑均給你一個白眼',h:'（可退貨）'},{k:'pat',c:'o',t:'苑均摸摸頭'},{k:'bite',c:'t',t:'苑均咬兩下'},
    {k:'thanks',c:'t',t:'銘謝惠顧，明天再來！'}
  ];
  var COLORS=[['#ff8fab','#ffe5ec'],['#ffd166','#fff6e0'],['#8ecae6','#e3f4fb'],['#b8e0a0','#eef8e6'],['#cdb4db','#f1e9f6'],['#ffadad','#ffeaea']];
  var NS='http://www.w3.org/2000/svg',g=document.getElementById('balls');
  var pos=[[78,120],[104,128],[132,126],[160,118],[66,96],[92,104],[120,108],[148,100],[174,96],[84,78],[112,84],[140,80],[162,74],[100,60],[128,58]];
  pos.forEach(function(p,i){
    var c=COLORS[i%COLORS.length],r=15,gg=document.createElementNS(NS,'g');gg.setAttribute('class','b');
    var a=document.createElementNS(NS,'circle');a.setAttribute('cx',p[0]);a.setAttribute('cy',p[1]);a.setAttribute('r',r);a.setAttribute('fill',c[0]);
    var b=document.createElementNS(NS,'path');b.setAttribute('d','M'+(p[0]-r)+' '+p[1]+' a'+r+' '+r+' 0 0 0 '+(2*r)+' 0 z');b.setAttribute('fill',c[1]);
    var h=document.createElementNS(NS,'circle');h.setAttribute('cx',p[0]-5);h.setAttribute('cy',p[1]-5);h.setAttribute('r',3.5);h.setAttribute('fill','#fff');h.setAttribute('opacity','.8');
    gg.appendChild(a);gg.appendChild(b);gg.appendChild(h);g.appendChild(gg);
  });
  var hearts=document.getElementById('hearts');
  ['💗','✨','💖','🌸','💗','✨'].forEach(function(s,i){var el=document.createElement('i');el.textContent=s;el.style.setProperty('--dx',((i-2.5)*22)+'px');el.style.animationDelay=(i*0.05)+'s';hearts.appendChild(el)});
  var machine=document.getElementById('machine'),drop=document.getElementById('dropcap'),box=document.getElementById('prizebox'),btn=document.getElementById('gachaBtn');
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function todayKey(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
  function load(){try{return JSON.parse(localStorage.getItem('gacha')||'null')}catch(e){return null}}
  function save(i){try{localStorage.setItem('gacha',JSON.stringify({d:todayKey(),i:i}))}catch(e){}}
  function show(i){var p=PRIZES[i];box.innerHTML=art(p.k,p.c)+'<div class="pt">'+esc(p.t)+'</div>'+(p.h?'<div class="ph">'+esc(p.h)+'</div>':'')}
  function lock(){btn.disabled=true;btn.textContent='明天再來扭 🌙'}
  var rolling=false,saved=load();
  if(saved&&saved.d===todayKey()&&PRIZES[saved.i]){show(saved.i);lock()}
  btn.addEventListener('click',function(){
    if(rolling)return;var s=load();if(s&&s.d===todayKey()){lock();return}
    rolling=true;btn.disabled=true;
    box.classList.remove('pop');hearts.classList.remove('go');
    box.innerHTML='<div class="pe">🌀</div><div class="pt">扭扭扭…</div>';
    var c=COLORS[Math.floor(Math.random()*COLORS.length)];
    drop.children[0].setAttribute('fill',c[0]);drop.children[1].setAttribute('fill',c[1]);
    drop.classList.remove('fall');machine.classList.remove('jig');void machine.getBoundingClientRect();
    machine.classList.add('jig');
    setTimeout(function(){drop.classList.add('fall')},1000);
    setTimeout(function(){
      var i=Math.floor(Math.random()*PRIZES.length);
      save(i);show(i);
      box.classList.add('pop');void hearts.offsetWidth;hearts.classList.add('go');
      drop.classList.remove('fall');machine.classList.remove('jig');
      lock();rolling=false;
    },1850);
  });
})();
</script>
<script type="module">
import {firebaseConfig} from './config.js';
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getFirestore,doc,onSnapshot,setDoc} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
const $=id=>document.getElementById(id);
const app=initializeApp(firebaseConfig),db=getFirestore(app),auth=getAuth(app),ref=doc(db,'stamp','main');
const PER=1000; // 幾點換 1 份禮物
let S={points:0,log:[],done:{}},admin=false,q=Promise.resolve();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const showLogin=new URLSearchParams(location.search).has('admin');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
function render(){
  const p=S.points,r=p%PER;
  $('pts').textContent=p;
  $('cards').textContent=Math.floor(p/PER)+' 份';
  $('fill').style.width=(r*100/PER)+'%';
  $('hint').textContent='每累積 '+PER+' 點可兌換 1 份禮物，目前 '+r+'/'+PER+' 點';
  $('taskTitle').textContent=admin?'快速任務加點':'任務清單（完成後會幫你加點）';
  document.querySelectorAll('button.task').forEach(b=>{const dn=(S.done||{})[b.dataset.n]===today();b.disabled=dn||!admin;b.style.cursor=admin?'pointer':'default';b.style.opacity=dn?'.5':'1';b.querySelector('em').textContent=dn?'今天完成了 ✓':'+'+b.dataset.d+' 點'});
  $('admin').hidden=!admin;$('loginBox').hidden=admin||!showLogin;$('outBtn').hidden=!admin;
  $('log').innerHTML=S.log.length?S.log.map(l=>{
    const d=new Date(l.t),ds=(d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    return '<div class="log"><div>'+esc(l.n||(l.d>0?'加點':'扣點'))+'<br><span>'+ds+'</span></div><div class="'+(l.d>0?'pos':'neg')+'">'+(l.d>0?'+':'')+l.d+'</div></div>';
  }).join(''):'<span class="sub">還沒有紀錄</span>';
}
function adjust(d,n,key){
  if(!admin)return;
  const np=Math.max(0,S.points+d),real=np-S.points;
  if(!real)return;
  const done={...(S.done||{})};if(key)done[key]=today();
  const next={points:np,log:[{t:Date.now(),d:real,n:n||''},...S.log].slice(0,50),done};
  const prev=S;S=next;render();
  q=q.then(()=>setDoc(ref,next)).catch(()=>{S=prev;render();$('msg').textContent='儲存失敗：請確認已登入管理員帳號'});
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button[data-d]');
  if(!b)return;
  const isTask=b.classList.contains('task');
  if(isTask&&(S.done||{})[b.dataset.n]===today())return;
  adjust(Number(b.dataset.d),isTask?b.dataset.n:$('note').value.trim(),isTask?b.dataset.n:null);
  if(!isTask)$('note').value='';
});
$('loginBtn').onclick=()=>signInWithEmailAndPassword(auth,$('em').value.trim(),$('pw').value)
  .then(()=>{$('pw').value='';$('msg').textContent=''}).catch(()=>{$('msg').textContent='登入失敗，請檢查 Email 和密碼'});
$('outBtn').onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{admin=!!u;render()});
const t=setTimeout(()=>{$('msg').textContent='暫時連不上，資料可能不是最新'},10000);
onSnapshot(ref,s=>{
  clearTimeout(t);$('msg').textContent='';
  if(s.exists()){const v=s.data();S={points:v.points||0,log:v.log||[],done:v.done||{}}}
  render();
},()=>{clearTimeout(t);$('msg').textContent='讀取失敗，請檢查網路或 Firebase 設定'});
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
